[workspace]
members = [
    "crates/ae_camera",
    "crates/ae_camera_controller",
    "crates/ae_diagnostic",
    "crates/ae_ecs",
    "crates/ae_gizmos",
    "crates/ae_gizmos_render",
    "crates/ae_input",
    "crates/ae_mesh",
    "crates/ae_scene",
    "crates/ae_state",
    "crates/ae_time",
    "crates/ae_transform",
    "crates/ae_ui",
    "crates/ae_assets",
    "crates/ae_core",
    "crates/ae_world",
    "crates/ae_renderer",
    "crates/ae_plugin_api",
    "crates/ae_plugin_host",
    "crates/ae_editor",
    "crates/ae_editor_ui",
    "crates/game_logic",
    "crates/ae_physics",
    "crates/ae_audio",
    "crates/ae_texture",
    "crates/ae_animation",
    "crates/ae_uidesign",
    "crates/ae_2d/ae-2d-core",
    "crates/ae_2d/ae-2d-render",
    "crates/ae_2d/ae-2d-physics",
    "crates/ae_2d/ae-2d-animation",
    "crates/ae_2d/ae_2d",
    "crates/ae_launcher",
    "crates/ae_mcp",
    "crates/ae_export",
    "crates/ae_runtime",
    "crates/ae_engine",
    "crates/irisui/irisui-core",
    "crates/irisui/irisui-dock",
    "crates/irisui/irisui-layout",
    "crates/irisui/irisui-text",
    "crates/irisui/irisui-wgpu",
    "crates/irisui/irisui-widgets",
    "crates/irisui/irisui-winit",
    "crates/irisui/irisui-workbench",
    "crates/irisui/irisui",
]
default-members = ["crates/ae_launcher"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes = "deny"
clone_on_ref_ptr = "deny"
disallowed_types = "deny"
mem_forget = "deny"
# unwrap_used = "deny"
# expect_used = "deny"

# Absolute Ban on Code Cheats, Placeholders & Debug Cruft
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Strict Performance & Ownership Rules
clone_on_copy = "deny"
redundant_clone = "deny"
cloned_instead_of_copied = "deny"
unnecessary_to_owned = "deny"

# Code Quality & Clean Idioms
manual_clamp = "deny"
if_same_then_else = "deny"
needless_range_loop = "deny"
needless_borrow = "deny"
redundant_closure = "deny"
redundant_pattern_matching = "deny"
single_match = "deny"
match_like_matches_macro = "deny"

# Prohibit raw AST node manipulation
disallowed_methods = "warn"

[workspace.dependencies]
ae-2d-core = { path = "crates/ae_2d/ae-2d-core" }
ae-2d-render = { path = "crates/ae_2d/ae-2d-render" }
ae-2d-physics = { path = "crates/ae_2d/ae-2d-physics" }
ae-2d-animation = { path = "crates/ae_2d/ae-2d-animation" }
ae_2d = { path = "crates/ae_2d/ae_2d" }
ae_camera = { path = "crates/ae_camera" }
ae_camera_controller = { path = "crates/ae_camera_controller" }
ae_diagnostic = { path = "crates/ae_diagnostic" }
ae_ecs = { path = "crates/ae_ecs" }
ae_gizmos = { path = "crates/ae_gizmos" }
ae_gizmos_render = { path = "crates/ae_gizmos_render" }
ae_input = { path = "crates/ae_input" }
ae_mesh = { path = "crates/ae_mesh" }
ae_scene = { path = "crates/ae_scene" }
ae_state = { path = "crates/ae_state" }
ae_time = { path = "crates/ae_time" }
ae_transform = { path = "crates/ae_transform" }
ae_ui = { path = "crates/ae_ui" }
ae_assets = { path = "crates/ae_assets" }
ae_mcp = { path = "crates/ae_mcp" }
ae_export = { path = "crates/ae_export" }
ae_runtime = { path = "crates/ae_runtime" }
ae_world = { path = "crates/ae_world" }

irisui-core = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-core" }
irisui-dock = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-dock" }
irisui-layout = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-layout" }
irisui-text = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-text" }
irisui-wgpu = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-wgpu" }
irisui-widgets = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-widgets" }
irisui-winit = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-winit" }
irisui-workbench = { version = "0.1.0-alpha.1", path = "crates/irisui/irisui-workbench" }
irisui = { path = "crates/irisui/irisui" }

slotmap = { version = "1.1.1", features = ["serde"] }
bitflags = "2.8"
bytemuck = { version = "1.21.0", features = ["derive"] }
glam = "0.33.12"
thiserror = "2.0.12"
log = "0.4.33"
env_logger = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
postcard = { version = "1.1.3", features = ["use-std"] }
lz4_flex = "0.14.2"
crc32fast = "1.5.5"
taffy = "0.15"
cosmic-text = "0.19.0"
glyphon = "0.12.0"
winit = { version = "0.30.9", features = ["rwh_06"] }
pollster = "1.0.1"
wgpu = { version = "30.0.2" }
arboard = "3.7.0"

[patch.crates-io]
wgpu = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
wgpu-core = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
wgpu-hal = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
wgpu-types = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
naga = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
