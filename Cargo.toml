wgpu-hal = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
wgpu-types = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
naga = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
