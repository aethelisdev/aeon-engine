[workspace]
members = [
    "crates/ae_core",
    "crates/ae_renderer",
    "crates/ae_plugin_api",
    "crates/ae_plugin_host",
    "crates/ae_editor",
    "crates/ae_editor_ui",
    "crates/game_logic",
    "crates/ae_physics",
    "crates/ae_audio",
    "crates/ae_texture",
    "crates/ae_animation",
    "crates/ae_uidesign",
    "crates/ae_2d/ae-2d-core",
    "crates/ae_2d/ae-2d-render",
    "crates/ae_2d/ae-2d-physics",
    "crates/ae_2d/ae-2d-animation",
    "crates/ae_2d/ae_2d",
    "crates/ae_launcher",
    "crates/ae_engine",
    "crates/irisui/iris-core",
    "crates/irisui/iris-dock",
    "crates/irisui/iris-layout",
    "crates/irisui/iris-text",
    "crates/irisui/iris-wgpu",
    "crates/irisui/iris-widgets",
    "crates/irisui/irisui",
]
default-members = ["crates/ae_launcher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
ae-2d-core = { path = "crates/ae_2d/ae-2d-core" }
ae-2d-render = { path = "crates/ae_2d/ae-2d-render" }
ae-2d-physics = { path = "crates/ae_2d/ae-2d-physics" }
ae-2d-animation = { path = "crates/ae_2d/ae-2d-animation" }
ae_2d = { path = "crates/ae_2d/ae_2d" }

iris-core = { path = "crates/irisui/iris-core" }
iris-dock = { path = "crates/irisui/iris-dock" }
iris-layout = { path = "crates/irisui/iris-layout" }
iris-text = { path = "crates/irisui/iris-text" }
iris-wgpu = { path = "crates/irisui/iris-wgpu" }
iris-widgets = { path = "crates/irisui/iris-widgets" }
irisui = { path = "crates/irisui/irisui" }

slotmap = { version = "1.1.1", features = ["serde"] }
bitflags = "2.8"
bytemuck = { version = "1.21.0", features = ["derive"] }
glam = "0.33.2"
thiserror = "2.0.12"
log = "0.4.33"
env_logger = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
taffy = "0.14"
cosmic-text = "0.19.0"
glyphon = "0.12.0"
winit = { version = "0.30.9", features = ["rwh_06"] }
pollster = "1.0.1"
wgpu = { version = "30.0.1" }

[patch.crates-io]
wgpu = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
wgpu-core = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
wgpu-hal = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
wgpu-types = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
naga = { git = "https://github.com/aethelisdev/aeongpu.git", branch = "aeon-v30" }
