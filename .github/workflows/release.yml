name: Aeon Engine Automated Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    if: github.repository == 'AethelisDEV/aeon-engine'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux x86_64
            artifact_name: aeon-engine-linux-x86_64
            binary_ext: ""
            archive_ext: "tar.gz"

          - os: macos-latest
            os_name: macOS Apple Silicon (ARM64)
            artifact_name: aeon-engine-macos-arm64
            binary_ext: ""
            archive_ext: "zip"

          - os: windows-latest
            os_name: Windows x86_64
            artifact_name: aeon-engine-windows-x86_64
            binary_ext: ".exe"
            archive_ext: "zip"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Rust Toolchain (stable)
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux System Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libudev-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev

    - name: Build Engine & Launcher (Release Mode)
      run: cargo build --release --workspace

    - name: Package Release Archive (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        TAG_NAME="${{ github.ref_name }}"
        PKG_DIR="${{ matrix.artifact_name }}-${TAG_NAME}"
        mkdir -p "${PKG_DIR}"
        cp target/release/ae_engine "${PKG_DIR}/" 2>/dev/null || true
        cp target/release/ae_launcher "${PKG_DIR}/" 2>/dev/null || true
        if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
          tar -czvf "${PKG_DIR}.tar.gz" "${PKG_DIR}"
          echo "RELEASE_ARCHIVE=${PKG_DIR}.tar.gz" >> $GITHUB_ENV
        else
          zip -r "${PKG_DIR}.zip" "${PKG_DIR}"
          echo "RELEASE_ARCHIVE=${PKG_DIR}.zip" >> $GITHUB_ENV
        fi

    - name: Package Release Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $pkgDir = "${{ matrix.artifact_name }}-$tag"
        New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
        if (Test-Path "target\release\ae_engine.exe") { Copy-Item "target\release\ae_engine.exe" -Destination "$pkgDir\" }
        if (Test-Path "target\release\ae_launcher.exe") { Copy-Item "target\release\ae_launcher.exe" -Destination "$pkgDir\" }
        Compress-Archive -Path "$pkgDir\*" -DestinationPath "$pkgDir.zip" -Force
        "RELEASE_ARCHIVE=$pkgDir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.RELEASE_ARCHIVE }}
        generate_release_notes: true
