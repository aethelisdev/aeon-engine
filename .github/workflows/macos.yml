name: Aeon Engine macOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test-macos:
    name: Build & Test (macOS Metal)
    runs-on: macos-latest
    if: github.repository == 'AethelisDEV/aeon-engine'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Rust Toolchain (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Ensure Clippy Component
      run: rustup component add clippy

    - name: Cache Cargo Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "aeon-engine-macos-cache"

    - name: Workspace Cargo Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::disallowed_methods

    - name: Workspace Tests
      run: cargo test --workspace --verbose