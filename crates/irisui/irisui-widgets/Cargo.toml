[package]
name = "irisui-widgets"
description = "Standard widget set and game-engine editor components for Iris UI"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true

[features]
default = ["clipboard-os"]
clipboard-os = ["dep:arboard"]

[dependencies]
irisui-core = { workspace = true }
irisui-layout = { workspace = true }
irisui-text = { workspace = true }
irisui-wgpu = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { workspace = true, optional = true }

[lints]
workspace = true

