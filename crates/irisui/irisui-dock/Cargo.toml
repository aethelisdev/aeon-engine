[package]
name = "irisui-dock"
description = "Binary Split-Tree Docking and multi-pane management engine for Iris UI"
version = "0.1.0"
edition.workspace = true
rust-version = "1.93"
authors.workspace = true
license.workspace = true
repository = "https://github.com/AethelisDEV/aeon-engine"
documentation = "https://docs.rs/irisui-dock"
readme = "README.md"
keywords = ["gui", "ui", "docking", "tabs", "split-tree"]
categories = ["gui"]
include = ["LICENSE-MPL-2.0", "src/**/*", "Cargo.toml", "README.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
irisui-core.workspace = true
irisui-widgets.workspace = true
slotmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
