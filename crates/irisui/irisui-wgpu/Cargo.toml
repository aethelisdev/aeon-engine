[package]
name = "irisui-wgpu"
description = "GPU SDF rendering pipeline and shader backend for Iris UI"
version = "0.1.0"
edition.workspace = true
rust-version = "1.93"
authors.workspace = true
license.workspace = true
repository = "https://github.com/AethelisDEV/aeon-engine"
documentation = "https://docs.rs/irisui-wgpu"
readme = "README.md"
keywords = ["gui", "wgpu", "sdf", "rendering", "shaders"]
categories = ["gui", "rendering", "graphics"]
include = ["LICENSE-MPL-2.0", "src/**/*", "Cargo.toml", "README.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
irisui-core = { workspace = true }
irisui-text = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
