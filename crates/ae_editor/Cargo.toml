[package]
name = "ae_editor"
version = "0.9.0"
edition = "2024"
description = "Aeon Engine - Editor utilities, camera, gizmo, snapping, and undo/redo"

[dependencies]
ae_ecs = { workspace = true }
ae_gizmos = { workspace = true }
cgmath = "0.18"
winit = { version = "0.30.13", features = ["serde"] }
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
postcard = { workspace = true }
ae_core = { path = "../ae_core" }
ae_plugin_api = { path = "../ae_plugin_api" }
ae_renderer = { path = "../ae_renderer" }
chrono = "0.4.45"

[lints]
workspace = true
