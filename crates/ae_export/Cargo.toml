[package]
name = "ae_export"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Asset dependency scanner, parallel Intermediate cooker, 16-byte aligned .aepak packer, and standalone desktop export pipeline"

[lints]
workspace = true

[dependencies]
ae_world = { workspace = true }
ae_texture = { path = "../ae_texture" }
ae_audio = { path = "../ae_audio" }
ae_mesh = { workspace = true }
bytemuck = { workspace = true }
rayon = "1.12.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
