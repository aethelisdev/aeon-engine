[package]
name = "ae_engine"
version = "0.7.0"
edition = "2024"
description = "Aeon Engine - Cross-platform game engine"

[dependencies]
winit = "0.30.13"
wgpu = "29.0.4"
pollster = "0.4.0"
env_logger = "0.11.11"
log = "0.4.33"
hecs = "0.11.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
cgmath = "0.18"
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
image = "0.25.10"
gltf = "1.4.1"

mint = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
spin_sleep = "1.3.3"
chrono = "0.4.45"
rfd = "0.17.2"

ae_plugin_api = { path = "../ae_plugin_api" }
ae_plugin_host = { path = "../ae_plugin_host" }
ae_core = { path = "../ae_core" }
ae_physics = { path = "../ae_physics" }
ae_audio = { path = "../ae_audio" }
ae_renderer = { path = "../ae_renderer" }
ae_editor = { path = "../ae_editor" }
ae_editor_ui = { path = "../ae_editor_ui" }
slotmap = { version = "1.1.1", features = ["serde"] }
rayon = "1.12.0"

[build-dependencies]
embed-resource = "2.4"

[target.'cfg(target_os = "linux")'.dependencies]
jemallocator = "0.5"

