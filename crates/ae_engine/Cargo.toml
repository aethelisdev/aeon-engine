[package]
name = "ae_engine"
version = "0.9.0"
edition = "2024"
description = "Aeon Engine - Cross-platform game engine"

[features]
default = ["mcp", "editor-dialogs"]
mcp = ["dep:ae_mcp"]
editor-dialogs = ["dep:rfd"]

[dependencies]
winit = "0.30.13"
wgpu = "30.0.2"
pollster = { workspace = true }
env_logger = "0.11.11"
log = "0.4.33"
ae_camera = { workspace = true }
ae_camera_controller = { workspace = true }
ae_diagnostic = { workspace = true }
ae_ecs = { workspace = true }
ae_gizmos = { workspace = true }
ae_gizmos_render = { workspace = true }
ae_input = { workspace = true }
ae_mesh = { workspace = true }
ae_scene = { workspace = true }
ae_state = { workspace = true }
ae_transform = { workspace = true }
ae_ui = { workspace = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
cgmath = "0.18"
irisui = { workspace = true }
image = "0.25.10"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
postcard = { workspace = true }
spin_sleep = "1.3.3"
chrono = "0.4.45"
rfd = { version = "0.17.2", optional = true }

ae_plugin_api = { path = "../ae_plugin_api" }
ae_plugin_host = { path = "../ae_plugin_host" }
ae_core = { path = "../ae_core" }
ae_2d = { workspace = true }
ae_assets = { workspace = true }
ae_physics = { path = "../ae_physics" }
ae_audio = { path = "../ae_audio" }
ae_animation = { path = "../ae_animation" }
ae_texture = { path = "../ae_texture" }
ae_renderer = { path = "../ae_renderer" }
ae_uidesign = { path = "../ae_uidesign" }
ae_editor = { path = "../ae_editor" }
ae_editor_ui = { path = "../ae_editor_ui" }
ae_runtime = { workspace = true }
ae_world = { workspace = true }
ae_export = { workspace = true }
ae_mcp = { workspace = true, optional = true }
slotmap = { version = "1.1.1", features = ["serde"] }
rayon = "1.12.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
jemallocator = "0.5"

[lints]
workspace = true
