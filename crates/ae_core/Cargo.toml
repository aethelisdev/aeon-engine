[package]
name = "ae_core"
version = "0.9.0"
edition = "2024"
description = "Aeon Engine - Minimal core runtime"

[dependencies]
ae_ecs = { workspace = true }
cgmath = "0.18"
glam = { workspace = true }
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
winit = { version = "0.30.13", features = ["serde"] }
slotmap = { version = "1.1.1", features = ["serde"] }
rayon = "1.12.0"
ae_plugin_api = { path = "../ae_plugin_api" }

[lints]
workspace = true

