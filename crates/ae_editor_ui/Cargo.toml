[package]
name = "ae_editor_ui"
version = "0.9.0"
edition = "2024"
description = "Aeon Engine - Editor native Iris UI panels, docking, and overlays"

[dependencies]
ae_ecs = { workspace = true }
ae_gizmos = { workspace = true }
log = "0.4.33"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
postcard = { workspace = true }
ae_core = { path = "../ae_core" }
ae_plugin_api = { path = "../ae_plugin_api" }
ae_world = { workspace = true }
ae_export = { workspace = true }
ae_editor = { path = "../ae_editor" }
ae_audio = { path = "../ae_audio" }
ae_animation = { path = "../ae_animation" }
ae_renderer = { path = "../ae_renderer" }
ae_uidesign = { path = "../ae_uidesign" }
ae_runtime = { path = "../ae_runtime" }
ae_assets = { workspace = true }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
winit = "0.30.13"
wgpu = "30.0.2"
cgmath = "0.18"
irisui = { workspace = true }
irisui-winit = { workspace = true }

[lints]
workspace = true
