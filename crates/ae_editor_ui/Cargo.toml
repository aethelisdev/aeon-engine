[package]
name = "ae_editor_ui"
version = "0.9.0"
edition = "2024"
description = "Aeon Engine - Clean declarative Iris UI editor layer"

[dependencies]
hecs = "0.11.0"
log = "0.4.33"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ae_core = { path = "../ae_core" }
ae_editor = { path = "../ae_editor" }
ae_audio = { path = "../ae_audio" }
ae_animation = { path = "../ae_animation" }
ae_renderer = { path = "../ae_renderer" }
ae_texture = { path = "../ae_texture" }
ae_uidesign = { path = "../ae_uidesign" }
ae_2d = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
winit = "0.30.13"
wgpu = "30.0.1"
cgmath = "0.18"
gltf = "1.4.1"
rayon = "1.12.0"
irisui = { workspace = true }
iris-core = { workspace = true }
iris-widgets = { workspace = true }
iris-layout = { workspace = true }
iris-dock = { workspace = true }
