[package]
name = "ae_editor_ui"
version = "0.8.0"
edition = "2024"
description = "Aeon Engine - Editor Egui UI panels and categories"

[dependencies]
hecs = "0.11.0"
log = "0.4.33"
egui = "0.36.0"
egui-wgpu = "0.36.0"
egui-winit = "0.36.0"
egui_dock = { version = "0.21.1", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ae_core = { path = "../ae_core" }
ae_editor = { path = "../ae_editor" }
ae_audio = { path = "../ae_audio" }
ae_animation = { path = "../ae_animation" }
ae_renderer = { path = "../ae_renderer" }
ae_texture = { path = "../ae_texture" }
ae_uidesign = { path = "../ae_uidesign" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
winit = "0.30.13"
wgpu = "30.0.1"
cgmath = "0.18"
rayon = "1.12.0"
gltf = "1.4.1"
irisui = { workspace = true }



