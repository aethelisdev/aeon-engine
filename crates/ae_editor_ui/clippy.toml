# Disallow raw node manipulation or direct pixel assignment in editor UI panels
cognitive-complexity-threshold = 30
too-many-lines-threshold = 600

disallowed-methods = [
    { path = "iris_core::tree::UiTree::create_node", reason = "Manual raw node instantiation is forbidden in editor UI. Use declarative layout primitives (Row, Column, Box, Card, etc.)." },
    { path = "iris_core::tree::UiTree::get_mut", reason = "Direct mutable access to UiNodes bypasses declarative abstraction. Mutate properties via UiScope or widget state bindings." },
    { path = "iris_core::tree::UiTree::add_child", reason = "Manual tree hierarchy construction is forbidden in editor UI. Use declarative scope nesting (scope.row, scope.column, scope.card)." },
    { path = "iris_widgets::panel::PanelBuilder::rect", reason = "Manual pixel rect assignment via PanelBuilder is forbidden. Use UiScope declarative layout engine." },
    { path = "iris_core::scope::UiScope::tree_mut", reason = "Direct access to mutable UiTree from UiScope is forbidden! Do not bypass scope abstractions to mutate nodes.", allow-invalid = true },
    { path = "iris_core::tree::UiTree::remove_node", reason = "Manual node removal is forbidden in editor UI. Let retained-mode scope lifecycle handle node pruning." },
    { path = "iris_core::tree::UiTree::set_node_layout", reason = "Manual layout override is forbidden. Rely strictly on Taffy layout engine via UiScope.", allow-invalid = true },
    { path = "iris_core::layout::layout_subtree", reason = "Manual subtree layout calculation in editor layer is forbidden. Use scope.finish_layout() or standard scope containers.", allow-invalid = true },
    { path = "iris_core::tree::UiTree::traverse_depth_first_mut", reason = "Bypassing declarative abstraction via tree traversal mutations is forbidden in editor UI. Use UiScope." },

    # Strict Autonomous Event Shield:
    { path = "iris_widgets::scroll_area::events::handle_scroll_area_event", reason = "Panels must NOT call scroll handlers manually! UiTree::dispatch_event handles scrolling autonomously." },
    { path = "iris_widgets::tree_view::selection::handle_tree_foldout_click", reason = "Manual tree foldout calls are forbidden! Use declarative scope.tree_row(...).clicked()." },
    { path = "iris_widgets::controls::numeric_drag::handle_numeric_drag_event", reason = "Manual numeric scrubber calls are forbidden! Use declarative scope.numeric_drag(...).changed()." },
    { path = "iris_widgets::controls::focus::handle_focus_event", reason = "Manual focus event handling is forbidden! Focus is managed autonomously by UiTree." },
    { path = "iris_winit::adapter::winit_to_ui_event", reason = "Converting winit events inside panel modules is forbidden. Dispatch once at window root!" },
]

disallowed-types = [
    { path = "winit::event::WindowEvent", reason = "Raw WindowEvent must NOT leak into panel event modules. Use UiTree declarative response standard." },
]
