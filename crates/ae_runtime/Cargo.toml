[package]
name = "ae_runtime"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Editor-free standalone runtime player shell for Aeon Engine"

[lints]
workspace = true

[features]
default = []
static-game-logic = ["dep:game_logic"]

[dependencies]
ae_app = { workspace = true }
winit = "0.30.13"
wgpu = "30.0.2"
pollster = { workspace = true }
env_logger = "0.11.11"
log = "0.4.33"
ae_camera = { workspace = true }
ae_ecs = { workspace = true }
ae_input = { workspace = true }
ae_scene = { workspace = true }
ae_time = { workspace = true }
ae_transform = { workspace = true }
ae_ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spin_sleep = "1.3.3"

ae_plugin_api = { path = "../ae_plugin_api" }
ae_plugin_host = { path = "../ae_plugin_host" }
ae_core = { path = "../ae_core" }
ae_2d = { workspace = true }
ae_physics = { path = "../ae_physics" }
ae_audio = { path = "../ae_audio" }
ae_renderer = { path = "../ae_renderer" }
ae_world = { workspace = true }
game_logic = { path = "../game_logic", optional = true }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
jemallocator = "0.5"
