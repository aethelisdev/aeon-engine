[package]
name = "ae_runtime"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Editor-free shared game simulation core and standalone runtime player for Aeon Engine"

[lints]
workspace = true

[features]
default = []
static-game-logic = ["dep:game_logic"]

[dependencies]
winit = "0.30.13"
wgpu = "30.0.2"
pollster = { workspace = true }
env_logger = "0.11.11"
log = "0.4.33"
ae_camera = { workspace = true }
ae_camera_controller = { workspace = true }
ae_ecs = { workspace = true }
ae_input = { workspace = true }
ae_scene = { workspace = true }
bytemuck = { workspace = true }
cgmath = "0.18"
serde = { workspace = true }
serde_json = { workspace = true }
slotmap = { version = "1.1.1", features = ["serde"] }
spin_sleep = "1.3.3"

ae_plugin_api = { path = "../ae_plugin_api" }
ae_plugin_host = { path = "../ae_plugin_host" }
ae_core = { path = "../ae_core" }
ae_2d = { workspace = true }
ae_physics = { path = "../ae_physics" }
ae_audio = { path = "../ae_audio" }
ae_animation = { path = "../ae_animation" }
ae_texture = { path = "../ae_texture" }
ae_renderer = { path = "../ae_renderer" }
ae_world = { workspace = true }
irisui-core = { workspace = true }
irisui-layout = { workspace = true }
irisui-text = { workspace = true }
irisui-wgpu = { workspace = true }
irisui-widgets = { workspace = true, default-features = false }
game_logic = { path = "../game_logic", optional = true }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
jemallocator = "0.5"
